# Parametros obrigatorios USUARIO e SENHA; a ultima entrada deixa o teclado aberto.
# IDs identificam os inputs sem depender da ordem dos rotulos.
appId: ${APP_ID}
tags: [auxiliar]
---
- runFlow:
    file: _preencher-usuario-local.yaml
    env:
      VALOR: ${USUARIO}
      CAMPO_USUARIO: cadastro-usuario
- scrollUntilVisible:
    element:
      id: cadastro-senha
    direction: DOWN
    centerElement: true
- tapOn:
    id: cadastro-senha
- inputText: ${SENHA}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: cadastro-confirmacao
    direction: DOWN
    centerElement: true
- tapOn:
    id: cadastro-confirmacao
- inputText: ${SENHA}
